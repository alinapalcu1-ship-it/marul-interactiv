name: Publică Mărul
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Pregătește fonturile locale Nunito și Fredoka
        run: |
          mkdir -p public/fonts
          FONT_REV=67bc647ce1910e92f461bcc82aae30f21d21a9cc
          curl -fLsS --retry 3 --max-time 45 "https://raw.githubusercontent.com/google/fonts/${FONT_REV}/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf" -o public/fonts/fredoka.ttf
          curl -fLsS --retry 3 --max-time 45 "https://raw.githubusercontent.com/google/fonts/${FONT_REV}/ofl/nunito/Nunito%5Bwght%5D.ttf" -o public/fonts/nunito.ttf
          curl -fLsS --retry 3 --max-time 45 "https://raw.githubusercontent.com/google/fonts/${FONT_REV}/ofl/fredoka/OFL.txt" -o public/fonts/Fredoka-OFL.txt
          curl -fLsS --retry 3 --max-time 45 "https://raw.githubusercontent.com/google/fonts/${FONT_REV}/ofl/nunito/OFL.txt" -o public/fonts/Nunito-OFL.txt
          test $(wc -c < public/fonts/fredoka.ttf) -gt 100000
          test $(wc -c < public/fonts/nunito.ttf) -gt 100000
      - run: node --test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publică
        id: deployment
        uses: actions/deploy-pages@v4
